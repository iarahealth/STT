[build-system]
requires = ["setuptools==69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["training"]
extend-exclude = [
    "native_client",
    "tensorflow",
    "kenlm",
    "taskcluster",
    "bin",
    "doc",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
